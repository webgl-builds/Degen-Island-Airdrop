<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari: standalone fullscreen mode when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Degen Island" />
    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Degen Island</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="apple-touch-icon" href="TemplateData/icons/unity-logo-dark.png" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- iOS "Add to Home Screen" prompt -->
    <div id="ios-prompt" style="display:none;">
      <div id="ios-prompt-bg"></div>
      <div id="ios-prompt-box">
        <p><strong>For the best experience:</strong></p>
        <p>Tap the <span style="font-size:1.3em;">⎋</span> Share button, then <strong>"Add to Home Screen"</strong></p>
        <p style="font-size:0.85em; opacity:0.7;">This will open the game in fullscreen like an app!</p>
        <button id="ios-prompt-close">Got it</button>
      </div>
    </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var searchParams = new URLSearchParams(window.location.search);
      var shouldRefreshCache = searchParams.get("refresh") === "true";
      var refreshSuffix = shouldRefreshCache ? "?refresh=" + Date.now() : "";

      function withRefreshSuffix(url) {
        return url + refreshSuffix;
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      async function clearUnityWebGlCaches() {
        try {
          if ("serviceWorker" in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter(function (registration) {
                  return registration.scope && registration.scope.toLowerCase().includes("/degen-island");
                })
                .map(function (registration) {
                  return registration.unregister();
                })
            );
          }
        } catch (error) {
          console.warn("[Degen Island] Failed to unregister service worker", error);
        }

        try {
          if ("caches" in window) {
            var cacheKeys = await caches.keys();
            await Promise.all(
              cacheKeys
                .filter(function (key) {
                  var normalized = key.toLowerCase();
                  return normalized.includes("degen island") || normalized.includes("degen-island") || normalized.includes("unitycache");
                })
                .map(function (key) {
                  return caches.delete(key);
                })
            );
          }
        } catch (error) {
          console.warn("[Degen Island] Failed to clear cache storage", error);
        }

        try {
          if (window.indexedDB && typeof window.indexedDB.deleteDatabase === "function") {
            await new Promise(function (resolve) {
              var request = window.indexedDB.deleteDatabase("UnityCache");
              request.onsuccess = function () { resolve(); };
              request.onerror = function () { resolve(); };
              request.onblocked = function () { resolve(); };
            });
          }
        } catch (error) {
          console.warn("[Degen Island] Failed to clear UnityCache indexedDB", error);
        }
      }

      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register(withRefreshSuffix("ServiceWorker.js"));
        }
      }

      // iOS Safari detection — show "Add to Home Screen" prompt
      (function() {
        var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        var isStandalone = window.navigator.standalone === true;
        var dismissed = localStorage.getItem('iosPromptDismissed');
        if (isIOS && !isStandalone && !dismissed) {
          var prompt = document.getElementById('ios-prompt');
          prompt.style.display = 'block';
          document.getElementById('ios-prompt-close').addEventListener('click', function() {
            prompt.style.display = 'none';
            localStorage.setItem('iosPromptDismissed', '1');
          });
          document.getElementById('ios-prompt-bg').addEventListener('click', function() {
            prompt.style.display = 'none';
            localStorage.setItem('iosPromptDismissed', '1');
          });
        }
      })();

      // Request fullscreen on first touch (works on Android Chrome, not iOS Safari)
      function tryFullscreen() {
        var el = document.documentElement;
        var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (rfs) {
          rfs.call(el).catch(function() {});
        }
        document.removeEventListener('touchstart', tryFullscreen);
        document.removeEventListener('click', tryFullscreen);
      }
      document.addEventListener('touchstart', tryFullscreen, { once: true });
      document.addEventListener('click', tryFullscreen, { once: true });

      var buildUrl = "Build";
      var loaderUrl = withRefreshSuffix(buildUrl + "/Temp Storage.loader.js");
      var config = {
        dataUrl: withRefreshSuffix(buildUrl + "/Temp Storage.data"),
        frameworkUrl: withRefreshSuffix(buildUrl + "/Temp Storage.framework.js"),
        codeUrl: withRefreshSuffix(buildUrl + "/Temp Storage.wasm"),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Degen Island",
        productVersion: "3.4.3",
        showBanner: unityShowBanner,
      };

      canvas.style.background = "url('" + buildUrl + "/Temp Storage.jpg') center / cover";
      loadingBar.style.display = "block";

      // ── Wallet Injection ─────────────────────────────────────────────────────
      // The flow:
      // 1. Unity Start() sends WALLET_REQUEST postMessage to parent (frontend)
      // 2. Frontend receives it and calls window.injectWallet(wallet) on its own window
      // 3. We receive it here via window.injectWallet (set by frontend on this window)
      // 4. We queue it until unityInstance is ready, then SendMessage
      // ─────────────────────────────────────────────────────────────────────────

      var unityInstance = null;
      var pendingWallet = null;

      // Called by frontend when it has the wallet ready
      window.injectWallet = function(wallet) {
        console.log("[WalletBridge] injectWallet called with wallet:", wallet ? wallet.substring(0, 8) + "..." : "null");
        if (!wallet) return;

        if (unityInstance) {
          // Instance ready — send immediately
          console.log("[WalletBridge] unityInstance ready, sending OnWalletReceived");
          unityInstance.SendMessage("NearManager", "OnWalletReceived", wallet);
        } else {
          // Queue it — will be sent once instance is ready
          console.log("[WalletBridge] unityInstance not ready, queueing wallet");
          pendingWallet = wallet;
        }
      };

      // ── End Wallet Injection ────────────────────────────────────────────────

      function loadUnity() {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function (instance) {
            loadingBar.style.display = "none";
            unityInstance = instance;
            console.log("[WalletBridge] Unity instance ready");

            // Flush any pending wallet that arrived before instance was ready
            if (pendingWallet) {
              console.log("[WalletBridge] Flushing pending wallet:", pendingWallet.substring(0, 8) + "...");
              instance.SendMessage("NearManager", "OnWalletReceived", pendingWallet);
              pendingWallet = null;
            }
          }).catch(function (message) {
            alert(message);
          });
        };
        script.onerror = function () {
          alert("Failed to load " + loaderUrl);
        };
        document.body.appendChild(script);
      }

      function bootUnity() {
        if (shouldRefreshCache) {
          clearUnityWebGlCaches().then(function () {
            registerServiceWorker();
            loadUnity();
          }).catch(function () {
            registerServiceWorker();
            loadUnity();
          });
          return;
        }

        registerServiceWorker();
        loadUnity();
      }

      bootUnity();
    </script>
  </body>
</html>
